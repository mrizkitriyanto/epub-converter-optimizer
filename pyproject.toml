[project]
name = "eco"
version = "0.2.0"
description = "Convert PDF and Markdown to EPUB"
requires-python = "==3.12.*"
license = "MIT"
dependencies = [
    "docling==2.150.1",
    "onnxruntime>=1.23",
    "torch>=2.13",
    "torchvision",
    "pypdfium2>=5.15",
    "pillow>=11",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "platformdirs>=4",
    "fonttools>=4.68",
    "huggingface-hub>=1.33",
    "httpx>=0.28",
    "requests>=2.32",
    "rapidocr>=3.10",
    "opencv-python-headless>=5.0.0.93,<5.1",
    "typst>=0.15",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
]

[project.scripts]
eco = "eco.cli:main"

[dependency-groups]
dev = [
    "pypdf>=7.1.0",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eco"]

[tool.uv]
constraint-dependencies = ["setuptools>=84.1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
addopts = "-m 'not slow and not acceptance'"
pythonpath = ["."]
markers = [
    "slow: needs downloaded models",
    "acceptance: needs the samples/ directory",
]
# Docling's own code reads some of its deprecated options while it runs, so every real conversion
# warns. eco sets none of those options. Each filter below is one of those messages, nothing wider.
filterwarnings = [
    # Docling serialises its OCR options, which reads the deprecated force_full_page_ocr field.
    'ignore:`force_full_page_ocr` is deprecated; set `mode=OcrMode\.FULL_PAGE` instead\.:DeprecationWarning',
    # standard_pdf_pipeline reads the deprecated generate_table_images option.
    'ignore:This field is deprecated\. Use `generate_page_images=True` and call `TableItem\.get_image\(\)` to extract table images from page images\.:DeprecationWarning',
    # rapid_ocr_model reads the deprecated rec_font_path option. The message is one word, so the
    # module is part of the match.
    'ignore:deprecated$:DeprecationWarning:docling\.models\.stages\.ocr\.rapid_ocr_model',
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", ".superpowers"]
