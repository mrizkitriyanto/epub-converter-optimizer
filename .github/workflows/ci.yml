name: CI

on:
  push:
    branches: [main, "m[0-9]-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - name: PyTorch is the CPU build
        if: runner.os == 'Linux'
        run: uv run python -c "import torch; assert '+cpu' in torch.__version__"
      - name: Git-style tool install uses CPU PyTorch
        if: runner.os == 'Linux'
        run: |
          uv tool install .
          "$(uv tool dir)/eco/bin/python" -c "import torch; assert '+cpu' in torch.__version__"

  native:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15
            name: macos-arm64
          - os: ubuntu-22.04
            name: linux-x64
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv pip install --python .venv pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.10
      - run: uv run --no-sync python scripts/build_native.py
      - run: uv run --no-sync python scripts/smoke_native.py out/native/dist/eco
      - uses: actions/upload-artifact@v4
        with:
          name: eco-native-${{ matrix.name }}
          path: out/native/eco-*
          if-no-files-found: error

  epubcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: uv sync --locked
      - name: Write the fixture EPUBs
        run: uv run pytest tests/epub -k epubcheck_export
        env:
          ECO_EPUBCHECK_DIR: out/epubcheck
      - name: Download EPUBCheck
        run: |
          curl -fsSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
      - name: Validate every EPUB
        run: |
          for f in out/epubcheck/*.epub; do java -jar epubcheck-5.4.0/epubcheck.jar "$f" || exit 1; done

  docker:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t eco:ci .
      - run: bash scripts/docker-smoke.sh eco:ci

  integration:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/eco/models
          key: docling-2.150.1
      - run: uv sync --locked
      - run: uv run eco setup --yes
      - run: uv run pytest -m slow

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No book files outside tests/fixtures
        run: |
          bad=$(git ls-files '*.pdf' '*.epub' '*.xtc' '*.xtch' | grep -v '^tests/fixtures/' || true)
          if [ -n "$bad" ]; then
            echo "Book files must not be committed outside tests/fixtures/:"
            echo "$bad"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - name: Export locked dependencies
        run: uv export --frozen --no-hashes --no-dev -o /tmp/req.txt
      - name: Check against the OSV database
        run: uvx pip-audit -r /tmp/req.txt --disable-pip --no-deps --vulnerability-service osv
