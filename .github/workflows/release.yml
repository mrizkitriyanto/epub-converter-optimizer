name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15
            name: macos-arm64
          - os: ubuntu-22.04
            name: linux-x64
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv pip install --python .venv pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.10
      - run: uv run --no-sync python scripts/build_native.py
      - run: uv run --no-sync python scripts/smoke_native.py out/native/dist/eco
      - uses: actions/upload-artifact@v7
        with:
          name: eco-native-${{ matrix.name }}
          path: out/native/eco-*
          if-no-files-found: error

  release:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag against package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/eco/__init__.py)
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/mrizkitriyanto/epub-converter-optimizer
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/download-artifact@v4
        with:
          pattern: eco-native-*
          path: out/native
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/native/eco-* --generate-notes
